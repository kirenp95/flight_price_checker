name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checker with dev deps
        working-directory: flysafair_checker
        run: pip install -e ".[dev]"

      - name: Run checker tests
        working-directory: flysafair_checker
        run: pytest

      - name: Install API with dev deps
        working-directory: flysafair_api
        run: pip install -e ".[dev]"

      - name: Run API tests
        working-directory: flysafair_api
        run: pytest
