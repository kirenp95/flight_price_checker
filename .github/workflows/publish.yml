name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checker with dev deps
        working-directory: flysafair_checker
        run: pip install -e ".[dev]"

      - name: Run checker tests
        working-directory: flysafair_checker
        run: pytest

      - name: Install API with dev deps
        working-directory: flysafair_api
        run: pip install -e ".[dev]"

      - name: Run API tests
        working-directory: flysafair_api
        run: pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build checker package
        working-directory: flysafair_checker
        run: python -m build

      - name: Build API package
        working-directory: flysafair_api
        run: python -m build

      - name: Publish checker to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: flysafair_checker/dist/

      - name: Publish API to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: flysafair_api/dist/
