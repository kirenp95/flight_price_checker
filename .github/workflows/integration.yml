name: Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with dev deps
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest -m integration -v