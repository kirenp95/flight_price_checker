[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "flysafair-price-checker"
version = "0.1.0"
description = "FlySafair flight price checker and tracker"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "[kiren]"}]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "requests>=2.28,<3",
    "beautifulsoup4>=4.11,<5",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0,<7",
    "pytest>=7.0,<9",
]

[project.urls]
Homepage = "https://github.com/kirenp95/"
Repository = "https://github.com/kirenp95/flight_price_checker"

[project.scripts]
flysafair-price-checker = "flysafair_checker.cli:main"

[tool.setuptools.packages.find]
include = ["flysafair_checker*"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that hit the real FlySafair API",
]
